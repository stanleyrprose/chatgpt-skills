name: validate-skill-architecture

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate Constitution and generated Registry
        run: python3 scripts/build-registry.py --check
      - name: Run Skill CI Quality Gate
        run: python3 scripts/skill_quality_gate.py
      - name: Run minimal regression tests
        run: python3 -m unittest discover -s tests -p "test_*.py"
